<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>canvas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 20px auto;
            background: #eee;
        }

        canvas#game {
            display: block;
            width: 100%;
            height: 100%;
            background: white;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        #game {
            display: block;
            background: #eee;
        }

        .timer {
            position: absolute;
            top: 20px;
            left: 25%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .totalDistance {
            position: absolute;
            top: 20px;
            left: 75%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .oneStepBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 60px;
            width: 140px;
            height: 40px;
        }

        .oneStepBtn:hover {
            background-color: black;
            color: white;
        }

        .twoStepBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 445px;
            width: 140px;
            height: 40px;
        }

        .twoStepBtn:hover {
            background-color: black;
            color: white;
        }

        .stopBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 280px;
            width: 100px;
            height: 40px;
        }

        .stopBtn:hover {
            background-color: black;
            color: white;
        }

        .startBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 290px;
            left: 260px;
            width: 100px;
            height: 40px;
        }

        .startBtn:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
<div id="game-container" style="position: relative; width: 640px; height: 480px; margin: 0 auto;">
    <canvas id="game" width="640" height="480"></canvas>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <h1>ゲームスタート</h1>
        <button class="startBtn" id="startBtn">スタート</button>
    </div>
    <div id="game-ui" class='hidden'>
        <div class="timer" id="timer">残り時間 : 60秒</div>
        <div class="totalDistance" id="totalDistance">現在 : 0 M</div>
        <button class="oneStepBtn" id="oneStepBtn">１つ進む</button>
        <button class="twoStepBtn" id="twoStepBtn">２つ進む</button>
    </div>
    <!-- リザルト画面 -->
    <div id="result-screen" class="screen hidden">
        <h1>FINISH!!</h1>
        <p id="finalDistance">最終到達距離: 0 M</p>
        <button id="retryBtn">もう一度</button>
    </div>
</div>
<script src="bundle.js"></script>
</body>
</html>
