<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>canvas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 602px;
            height: 280px;
            margin: 20px auto;
            background: #F4E511;
        }

        /*canvas#game {*/
        /*    display: block;*/
        /*    width: 100%;*/
        /*    height: 100%;*/
        /*    background: white;*/
        /*}*/

        .screen {
            position: relative;
            width: 602px;
            height: 280px;
            margin: 0 auto;
            background: rgba(244, 229, 17, 1); /* ← alpha=1 そのまま */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        #game {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .timer {
            position: absolute;
            top: 20px;
            left: 25%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .totalDistance {
            position: absolute;
            top: 20px;
            left: 75%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .oneStepBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 60px;
            width: 140px;
            height: 40px;
        }

        .oneStepBtn:hover {
            background-color: black;
            color: white;
        }

        .twoStepBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 445px;
            width: 140px;
            height: 40px;
        }

        .twoStepBtn:hover {
            background-color: black;
            color: white;
        }

        .stopBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 280px;
            width: 100px;
            height: 40px;
        }

        .stopBtn:hover {
            background-color: black;
            color: white;
        }

        .startBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 40px;
            left: 260px;
            width: 100px;
            height: 40px;
        }

        .startBtn:hover {
            background-color: black;
            color: white;
        }
        #start-screen canvas#game {
            position: absolute;
            inset: 0;
            z-index: 2; /* ← ここを大きくして前面に */
            pointer-events: none; /* ← ボタンをクリックできるように */
        }
    </style>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
</head>
<body>
<div id="game-container" style="position: relative; width: 602px; height: 280px; margin: 0 auto;">

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <h1>ゲームスタート</h1>
        <button class="startBtn" id="startBtn">スタート</button>
    </div>
        <canvas id="game" width="602" height="280"></canvas>
    <div id="game-ui" class='hidden'>
        <div class="timer" id="timer">残り時間 : 60秒</div>
        <div class="totalDistance" id="totalDistance">現在 : 0 M</div>
        <button class="oneStepBtn" id="oneStepBtn">１つ進む</button>
        <button class="twoStepBtn" id="twoStepBtn">２つ進む</button>
    </div>
    <!-- リザルト画面 -->
    <div id="result-screen" class="screen hidden">
        <h1>FINISH!!</h1>
        <p id="finalDistance">最終到達距離: 0 M</p>
        <button id="retryBtn">もう一度</button>
    </div>
</div>
<script src="bundle.js"></script>
</body>
</html>
