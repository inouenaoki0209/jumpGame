<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>canvas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #game {
            display: block;
            background: #eee;
        }

        .timer {
            position: absolute;
            top: 20px;
            left: 25%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .totalDistance {
            position: absolute;
            top: 20px;
            left: 75%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .oneStepBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 60px;
            width: 100px;
            height: 40px;
        }

        .oneStepBtn:hover {
            background-color: black;
            color: white;
        }

        .twoStepBtn {
            position: absolute;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: all 0.3s;
            top: 420px;
            left: 490px;
            width: 100px;
            height: 40px;
        }

        .twoStepBtn:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
<div id="game-container" style="position: relative; width: 640px; height: 480px; margin: 0 auto;">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="timer" class="timer">残り時間 : 60秒</div>
    <div id="totalDistance" class="totalDistance">現在 : 0 M</div>
    <button id="oneStepBtn" class="oneStepBtn">１つ進む</button>
    <button id="twoStepBtn" class="twoStepBtn">２つ進む</button>
</div>
<script src="bundle.js"></script>
</body>
</html>
